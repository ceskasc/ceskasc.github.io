function detectLocale(){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'',langs=navigator.languages||[navigator.language||''];return tz==='Europe/Istanbul'||langs.some(x=>/^tr(?:-|$)/i.test(x))?'tr':'en'}

const copy={en:{introMicro:'A TEMPORAL PERCEPTION EXPERIMENT',introTitle:'CAN YOU FEEL<br>TIME WITHOUT<br><em>SEEING IT?</em>',introLede:'Watch an interval once. Then recreate it with no clock, no progress bar and no correction. AION measures the distance between physical time and the time your mind believes has passed.',protocol:'The clock measures duration. You measure yourself.',enter:'ENTER AION',round:'INTERVAL',resultKicker:'DISTANCE FROM PHYSICAL TIME',meanError:'MEAN ERROR',consistency:'CONSISTENCY',worldRank:'WORLD RANK',fiveIntervals:'FIVE BLIND INTERVALS',quote:'The clock measured time. You measured yourself.',verification:'GLOBAL ARCHIVE',again:'RUN AGAIN',share:'SHARE RESULT',identityTitle:'HOW SHOULD TIME<br><em>REMEMBER YOU?</em>',identityCopy:'Choose a public pseudonym. No account, email or phone number is required.',publicName:'PUBLIC NAME',claim:'CLAIM IDENTITY',archiveTitle:'THE CHRONICLE',archiveSubtitle:'Every mind keeps a different clock.',minds:'MINDS',attempts:'RUNS',closest:'CLOSEST',loadingArchive:'READING THE CHRONICLE…'},tr:{introMicro:'ZAMAN ALGISI ÜZERİNE BİR DENEY',introTitle:'ZAMANI<br>GÖRMEDEN<br><em>HİSSEDEBİLİR MİSİN?</em>',introLede:'Bir zaman aralığını bir kez izle. Sonra saat, ilerleme çubuğu ve düzeltme olmadan aynı süreyi yeniden üret. AION, fiziksel zaman ile zihninin geçtiğine inandığı zaman arasındaki mesafeyi ölçer.',protocol:'Saat süreyi ölçer. Sen kendini ölçersin.',enter:'AION’A GİR',round:'ARALIK',resultKicker:'FİZİKSEL ZAMANA MESAFE',meanError:'ORT. HATA',consistency:'TUTARLILIK',worldRank:'DÜNYA SIRASI',fiveIntervals:'BEŞ KÖR ZAMAN ARALIĞI',quote:'Saat zamanı ölçtü. Sen kendini ölçtün.',verification:'GLOBAL KRONİK',again:'TEKRAR DENE',share:'SONUCU PAYLAŞ',identityTitle:'ZAMAN SENİ<br><em>NASIL HATIRLASIN?</em>',identityCopy:'Herkese açık bir takma ad seç. Hesap, e-posta veya telefon gerekmez.',publicName:'HERKESE AÇIK İSİM',claim:'KİMLİĞİ AL',archiveTitle:'KRONİK',archiveSubtitle:'Her zihin farklı bir saat taşır.',minds:'ZİHİNLER',attempts:'DENEYLER',closest:'EN YAKIN',loadingArchive:'KRONİK OKUNUYOR…'}}[lang];

const phrases={observe:tr?['REFERANSI İZLE','BU ARALIĞI HAFIZANA AL','SAYMAYA ÇALIŞMA. HİSSET.']:['OBSERVE THE REFERENCE','LET THIS INTERVAL ENTER MEMORY','DO NOT COUNT. FEEL IT.'],gap:tr?['SAAT KAYBOLUYOR','ŞİMDİ AYNI SÜREYİ İÇERİDEN BUL','BİR SONRAKİ İŞARET BAŞLANGIÇ.']:['THE CLOCK DISAPPEARS','NOW FIND THE SAME DURATION FROM WITHIN','THE NEXT SIGNAL IS THE START.'],recall:tr?['ZAMAN ŞİMDİ GÖRÜNMEZ','BİTTİĞİNİ HİSSEDİNCE DOKUN','GÖSTERGE YOK. DÜZELTME YOK.']:['TIME IS NOW INVISIBLE','TAP WHEN YOU FEEL IT HAS ENDED','NO DISPLAY. NO CORRECTION.'],captured:tr?['YAKALANDI','İZ KAYDEDİLDİ','SONUÇLAR EN SONDA AÇILACAK.']:['CAPTURED','THE TRACE OF TIME WAS KEPT','RESULTS REVEAL ONLY AT THE END.']};
let install=localStorage.getItem(INSTALL_KEY);if(!install||!/^[0-9a-f-]{36}$/i.test(install)){install=crypto.randomUUID();localStorage.setItem(INSTALL_KEY,install)}let name=localStorage.getItem(NAME_KEY)||'',challenge=null,targets=[],elapsed=[],roundIndex=0,recallStart=0,tapResolver=null,pendingStart=false,lastResult=null;
function scene(id){document.querySelectorAll('.scene').forEach(s=>s.classList.toggle('active',s.id===id))}function overlay(id,on){const el=$(id);el.classList.toggle('open',on);el.setAttribute('aria-hidden',on?'false':'true')}function loading(on,text){$('loading').classList.toggle('on',on);if(text)$('loadingText').textContent=text}
function identityUI(){const b=$('playerBadge');b.hidden=!name;if(name)b.textContent=name.toUpperCase().slice(0,12)}identityUI();
async function call(action,data={},timeout=9000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,...data}),signal:c.signal});let j={};try{j=await r.json()}catch{}if(!r.ok){const e=new Error(j.error||'request_failed');e.code=j.error;throw e}return j}finally{clearTimeout(t)}}
function cleanName(v){v=v.normalize('NFKC').trim().replace(/\s+/g,' ');return v.length>=2&&v.length<=20&&/^\p{L}[\p{L}\p{N}._ -]*$/u.test(v)?v:null}
function openIdentity(start=false){pendingStart=start;$('identityError').textContent='';$('nickname').value=name;overlay('identityOverlay',true);setTimeout(()=>$('nickname').focus(),80)}
async function register(){const n=cleanName($('nickname').value);if(!n){$('identityError').textContent=tr?'2–20 karakter kullan ve bir harfle başla.':'Use 2–20 characters and begin with a letter.';return}$('claim').disabled=true;try{const d=await call('register',{installationId:install,nickname:n});name=d.player?.nickname||n;localStorage.setItem(NAME_KEY,name);identityUI();overlay('identityOverlay',false);$('nickname').blur();const go=pendingStart;pendingStart=false;if(go)startExperiment()}catch(e){$('identityError').textContent=e.code==='nickname_taken'?(tr?'Bu isim kullanılıyor.':'That name is already taken.'):(tr?'Global sisteme ulaşılamadı.':'Could not reach the global system.')}finally{$('claim').disabled=false}}
$('claim').onclick=register;$('nickname').addEventListener('keydown',e=>{if(e.key==='Enter')register()});$('identityClose').onclick=()=>{pendingStart=false;overlay('identityOverlay',false)};
let audio=null;function ensureAudio(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}function tone(freq=260,dur=.08,vol=.045){try{ensureAudio();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(vol,audio.currentTime+.008);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur+.02)}catch{}}function buzz(pattern){try{navigator.vibrate?.(pattern)}catch{}}
function phase(kind){const a=phrases[kind];$('game').dataset.phase=kind;$('phaseKicker').textContent=a[0];$('phaseTitle').textContent=a[1];$('phaseHint').textContent=a[2]}
async function startExperiment(){ensureAudio();loading(true,tr?'ZAMAN SENKRONİZE EDİLİYOR…':'SYNCHRONIZING TIME…');try{const d=await call('challenge',{installationId:install});challenge=d.challengeId;targets=d.reference;elapsed=[];roundIndex=0;scene('game');await delay(450);loading(false);await runRound()}catch{loading(false);alert(tr?'AION sunucusuna şu an ulaşılamıyor.':'AION server is currently unavailable.')}}
async function runRound(){if(roundIndex>=5){return submitRun()}const target=Number(targets[roundIndex]);$('roundNo').textContent=String(roundIndex+1).padStart(2,'0')+' / 05';$('progressBar').style.width=(roundIndex/5*100)+'%';$('game').style.setProperty('--reference-ms',target+'ms');$('tapZone').disabled=true;phase('observe');tone(210,.1,.035);buzz(12);await delay(80);await delay(target);tone(440,.09,.045);buzz(18);phase('gap');await delay(720);phase('recall');tone(310,.06,.04);buzz(10);recallStart=performance.now();$('tapZone').disabled=false;const measured=await new Promise(resolve=>{tapResolver=resolve;setTimeout(()=>{if(tapResolver){tapResolver=null;resolve(7000)}},7000)});$('tapZone').disabled=true;elapsed.push(Math.min(7000,Math.max(250,measured)));tone(520,.06,.035);buzz(8);phase('captured');$('progressBar').style.width=((roundIndex+1)/5*100)+'%';roundIndex++;await delay(620);runRound()}
$('tapZone').addEventListener('pointerdown',e=>{if($('game').dataset.phase!=='recall'||!tapResolver)return;e.preventDefault();const r=tapResolver;tapResolver=null;r(performance.now()-recallStart)},{passive:false});
function bandCopy(b){const m=tr?{singularity:['ZAMANLA NEREDEYSE ÇAKIŞTIN.','İç saatin fiziksel aralığa olağan dışı bir kesinlikle yaklaştı.'],attuned:['ZAMANA AYARLISIN.','Algın, görünmeyen süreyi şaşırtıcı biçimde korudu.'],precise:['İÇ SAATİN NET.','Zaman kaybolduğunda bile ritmin büyük ölçüde yerinde kaldı.'],steady:['RİTİM KORUNDU.','Sapma var; ama zihnin süreyi tutarlı biçimde yeniden kuruyor.'],human:['İNSANİ BİR SAAT.','Algılanan zaman fiziksel zamandan ayrılıyor; yine de örüntü okunabilir.'],drift:['ZAMAN KAYDI.','İç saat, dış dünyanın saatinden kendi yönüne doğru uzaklaştı.']}:{singularity:['YOU NEARLY COINCIDED WITH TIME.','Your internal clock approached the physical intervals with improbable precision.'],attuned:['YOU ARE ATTUNED TO TIME.','Your perception preserved invisible duration with unusual accuracy.'],precise:['YOUR INNER CLOCK IS CLEAR.','Even after the clock vanished, your rhythm remained close to the reference.'],steady:['THE RHYTHM HELD.','There is drift, but your mind reconstructs duration with consistency.'],human:['A HUMAN CLOCK.','Perceived time diverges from physical time, yet a coherent pattern remains.'],drift:['TIME DRIFTED.','Your inner clock moved away from the external one in its own direction.']};return m[b]||m.drift}
async function submitRun(){scene('result');$('scoreValue').textContent='—';$('verifyState').textContent=tr?'DOĞRULANIYOR…':'VERIFYING…';$('verifyState').className='';try{const d=await call('submit',{installationId:install,nickname:name,challengeId:challenge,elapsed,locale:lang},12000);lastResult=d.result;renderResult(d.result);if(d.archive)renderArchive(d.archive)}catch(e){$('verifyState').textContent=tr?'YEREL / TEKRAR DENE':'LOCAL / RETRY';$('verifyState').className='failed';lastResult={pending:true,challengeId:challenge,elapsed:[...elapsed]}}}
function renderResult(r){$('scoreValue').textContent=Number(r.score).toFixed(3);const bc=bandCopy(r.band);$('resultTitle').textContent=bc[0];$('resultNote').textContent=bc[1];$('meanError').textContent=Math.round(r.meanError)+' ms';$('consistency').textContent='± '+Math.round(r.consistency)+' ms';$('worldRank').textContent=r.rank?'#'+r.rank:'—';$('biasLabel').textContent=(r.bias>=0?'+':'')+Math.round(r.bias)+' ms '+(tr?'SAPMA':'BIAS');$('verifyState').textContent=tr?'DOĞRULANDI':'VERIFIED';$('verifyState').className='verified';const box=$('roundErrors');box.innerHTML='';for(const q of(r.rounds||[])){const d=document.createElement('div');d.className='error-bar';const i=document.createElement('i');const e=Number(q.error)||0,mag=Math.min(44,Math.abs(e)/12);i.style.width=mag+'%';i.style.left=e>=0?'50%':(50-mag)+'%';d.append(i);box.append(d)}}
$('again').onclick=()=>startExperiment();$('share').onclick=async()=>{if(!lastResult||lastResult.pending)return;const text=`AION — ${Number(lastResult.score).toFixed(3)}% · ${Math.round(lastResult.meanError)} ms · WORLD ${lastResult.rank?'#'+lastResult.rank:'—'}\nhttps://ceskasc.github.io/aion/`;try{if(navigator.share)await navigator.share({title:'AION',text,url:'https://ceskasc.github.io/aion/'});else await navigator.clipboard.writeText(text)}catch{}};
async function loadArchive(){const l=$('archiveList');l.innerHTML='<div class="empty">'+copy.loadingArchive+'</div>';try{renderArchive(await call('leaderboard',{limit:30}))}catch{l.innerHTML='<div class="empty">'+(tr?'Kroniğe şu an ulaşılamıyor.':'The chronicle is unavailable.')+'</div>'}}
function renderArchive(d){$('statPlayers').textContent=Number(d?.stats?.players||0).toLocaleString();$('statAttempts').textContent=Number(d?.stats?.attempts||0).toLocaleString();$('statBest').textContent=Number(d?.stats?.bestScore||0).toFixed(3)+'%';const l=$('archiveList');l.innerHTML='';const rows=d?.rows||[];if(!rows.length){l.innerHTML='<div class="empty">'+(tr?'Henüz doğrulanmış deney yok.':'No verified runs yet.')+'</div>';return}for(const r of rows){const row=document.createElement('div');row.className='archive-row'+(name&&r.nickname===name?' me':'');const n=document.createElement('span');n.className='rankno';n.textContent=String(r.rank).padStart(2,'0');const nm=document.createElement('div');nm.className='archive-name';const b=document.createElement('b');b.textContent=r.nickname;const s=document.createElement('span');s.textContent=Math.round(r.meanError)+' ms · ±'+Math.round(r.consistency)+' ms';nm.append(b,s);const sc=document.createElement('div');sc.className='archive-score';sc.textContent=Number(r.score).toFixed(3);const pct=document.createElement('small');pct.textContent='%';sc.append(pct);row.append(n,nm,sc);l.append(row)}}
$('archiveBtn').onclick=()=>{overlay('archiveOverlay',true);loadArchive()};$('archiveClose').onclick=()=>overlay('archiveOverlay',false);$('home').onclick=()=>{scene('intro');overlay('archiveOverlay',false)};$('start').onclick=()=>{if(!name)openIdentity(true);else startExperiment()};
(async()=>{try{const d=await call('identity',{installationId:install});if(d.player?.nickname){name=d.player.nickname;localStorage.setItem(NAME_KEY,name);identityUI()}}catch{}try{renderArchive(await call('leaderboard',{limit:12}))}catch{}})();
function initField(){const c=$('field'),gl=c.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'low-power'});if(!gl){c.style.display='none';return}$('fallback').style.display='none';const vs=`#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;const fs=`#version 300 es\nprecision highp float;out vec4 o;uniform vec2 r;uniform float t;void main(){vec2 u=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);float d=length(u);float a=atan(u.y,u.x);float w=.5+.5*sin(9.*d-0.22*t+1.4*sin(3.*a+0.08*t));float ring=exp(-18.*abs(d-(.42+.035*sin(a*4.-t*.12))));float core=exp(-5.5*d*d);float sweep=pow(max(0.,cos(a-.1*t)),42.)*exp(-2.8*d);vec3 base=vec3(.006,.012,.035);vec3 blue=vec3(.19,.27,.95);vec3 cyan=vec3(.36,.9,1.);vec3 col=base+blue*core*.14+cyan*ring*(.08+.15*w)+blue*sweep*.1;col+=vec3(.08,.1,.24)*(.025*w)/(1.+8.*d*d);o=vec4(col,1.);}`;function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);const ur=gl.getUniformLocation(pr,'r'),ut=gl.getUniformLocation(pr,'t');let start=performance.now();function resize(){const d=Math.min(devicePixelRatio||1,1.5),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}}function frame(now){resize();gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,(now-start)/1000);gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(frame)}requestAnimationFrame(frame)}initField();
