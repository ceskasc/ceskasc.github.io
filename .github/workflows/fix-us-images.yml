name: Fix relationship site images

on:
  push:
    branches: [main]
    paths:
      - 'us/assets-src/**'
      - '.github/workflows/fix-us-images.yml'

permissions:
  contents: write

jobs:
  restore-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate WebP assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p us/assets
          for name in film konya heart night coffee; do
            base64 --decode "us/assets-src/${name}.b64" > "us/assets/${name}.webp"
            test -s "us/assets/${name}.webp"
            test "$(head -c 4 "us/assets/${name}.webp")" = "RIFF"
            test "$(dd if="us/assets/${name}.webp" bs=1 skip=8 count=4 status=none)" = "WEBP"
          done

      - name: Commit repaired assets and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -rf us/assets-src
          rm -f us/.image-fix-placeholder us/.image-fix-branch-marker us/.ignore-this us/.temp us/.delete-me us/.will-clean
          rm -f .github/workflows/fix-us-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(us): restore relationship images and clean temp files"
          git push
