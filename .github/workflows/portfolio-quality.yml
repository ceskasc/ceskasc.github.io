name: Internet Cemetery quality

on:
  pull_request:
    paths:
      - 'index.html'
      - 'cemetery.css'
      - 'cemetery.js'
      - 'cemetery-og.svg'
      - 'portfolio.html'
      - '.github/workflows/portfolio-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cemetery.css'
      - 'cemetery.js'
      - 'cemetery-og.svg'
      - 'portfolio.html'
      - '.github/workflows/portfolio-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check cemetery.js

      - name: Parse HTML and verify links, IDs, and local assets
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class SiteParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
                  self.sources = []
                  self.dialogs = 0

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag in {'script', 'link', 'img'}:
                      value = attrs.get('src') or attrs.get('href')
                      if value:
                          self.sources.append(value)
                  if tag == 'dialog':
                      self.dialogs += 1

          html = Path('index.html').read_text(encoding='utf-8')
          parser = SiteParser()
          parser.feed(html)

          required = ['cemetery.css', 'cemetery.js', 'cemetery-og.svg', 'favicon.svg', 'portfolio.html']
          missing = [path for path in required if not Path(path).exists()]
          if missing:
              raise SystemExit(f'Missing required assets: {missing}')

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate IDs: {duplicates}')

          required_ids = {'gate', 'graveyard', 'catacombs', 'dig', 'memorial', 'burialForm', 'soundToggle'}
          missing_ids = sorted(required_ids - set(parser.ids))
          if missing_ids:
              raise SystemExit(f'Missing required IDs: {missing_ids}')

          if parser.dialogs != 1:
              raise SystemExit(f'Expected one memorial dialog, found {parser.dialogs}')

          bad_links = [href for href in parser.links if not href.strip() or href.lower().startswith('javascript:')]
          if bad_links:
              raise SystemExit(f'Unsafe or empty links: {bad_links}')

          for href in parser.links:
              if href.startswith(('#', 'mailto:', 'http://', 'https://')):
                  continue
              parsed = urlparse(href)
              if parsed.scheme:
                  continue
              local = href.split('#', 1)[0].split('?', 1)[0]
              if local and not Path(local).exists():
                  raise SystemExit(f'Broken local link: {href}')

          print('Internet Cemetery HTML, links, IDs, and assets passed.')

      - name: Guard interaction, accessibility, and resilience hooks
        run: |
          grep -q 'prefers-reduced-motion' cemetery.css
          grep -q 'aria-expanded' index.html
          grep -q 'aria-live' index.html
          grep -q 'inert' index.html
          grep -q '<dialog' index.html
          grep -q 'IntersectionObserver' cemetery.js
          grep -q 'localStorage' cemetery.js
          grep -q 'AudioContext' cemetery.js
          grep -q 'Europe/Istanbul' cemetery.js
          echo 'Interaction, accessibility, and resilience hooks present.'
