name: Site quality

on:
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'experience.css'
      - 'script.js'
      - 'internet-cemetery/**'
      - '.github/workflows/portfolio-quality.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'experience.css'
      - 'script.js'
      - 'internet-cemetery/**'
      - '.github/workflows/portfolio-quality.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check internet-cemetery/cemetery.js

      - name: Validate portfolio and cemetery structure
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []
                  self.dialogs = 0
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'a' and 'href' in attrs:
                      self.links.append(attrs['href'])
                  if tag == 'dialog':
                      self.dialogs += 1

          def validate_html(path, required_ids, required_assets, expect_dialog=False):
              html_path = Path(path)
              html = html_path.read_text(encoding='utf-8')
              parser = Parser(); parser.feed(html)
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  raise SystemExit(f'{path}: duplicate IDs: {duplicates}')
              missing_ids = sorted(set(required_ids) - set(parser.ids))
              if missing_ids:
                  raise SystemExit(f'{path}: missing IDs: {missing_ids}')
              missing_assets = [p for p in required_assets if not Path(p).exists()]
              if missing_assets:
                  raise SystemExit(f'{path}: missing assets: {missing_assets}')
              if expect_dialog and parser.dialogs != 1:
                  raise SystemExit(f'{path}: expected one dialog, found {parser.dialogs}')
              base = html_path.parent
              for href in parser.links:
                  if not href.strip() or href.lower().startswith('javascript:'):
                      raise SystemExit(f'{path}: unsafe/empty link: {href}')
                  if href.startswith(('#','mailto:','http://','https://')):
                      continue
                  parsed = urlparse(href)
                  if parsed.scheme:
                      continue
                  local = href.split('#',1)[0].split('?',1)[0]
                  if local and not (base / local).exists():
                      raise SystemExit(f'{path}: broken local link: {href}')

          validate_html(
              'index.html',
              {'main-content','work','practice','about','contact','project-grid'},
              ['style.css','experience.css','script.js','favicon.svg','og-card.svg','Sadik_Can_Ceska_Portfolio_CV_PrivacySafe.pdf']
          )
          validate_html(
              'internet-cemetery/index.html',
              {'gate','graveyard','catacombs','dig','memorial','burialForm','soundToggle'},
              ['internet-cemetery/cemetery.css','internet-cemetery/cemetery.js','internet-cemetery/cemetery-og.svg','internet-cemetery/favicon.svg'],
              expect_dialog=True
          )
          print('Portfolio and Internet Cemetery structure passed.')

      - name: Guard accessibility and interaction hooks
        run: |
          grep -q 'prefers-reduced-motion' style.css
          grep -q 'IntersectionObserver' script.js
          grep -q 'prefers-reduced-motion' internet-cemetery/cemetery.css
          grep -q 'IntersectionObserver' internet-cemetery/cemetery.js
          grep -q 'localStorage' internet-cemetery/cemetery.js
          grep -q 'AudioContext' internet-cemetery/cemetery.js
          echo 'Accessibility and interaction hooks present.'
