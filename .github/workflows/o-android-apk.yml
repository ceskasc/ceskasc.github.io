name: Build O Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/o-android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/o-android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --stacktrace

      - name: Publish APK into site
        run: |
          mkdir -p o/download
          cp android/app/build/outputs/apk/debug/app-debug.apk o/download/O-Perfect-Circle-v13.5-debug.apk
          sha256sum o/download/O-Perfect-Circle-v13.5-debug.apk > o/download/O-Perfect-Circle-v13.5-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: O-Perfect-Circle-v13.5-debug-apk
          path: o/download/O-Perfect-Circle-v13.5-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit downloadable APK
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add o/download/O-Perfect-Circle-v13.5-debug.apk o/download/O-Perfect-Circle-v13.5-debug.apk.sha256
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build O. Android v13.5 debug APK"
            git push
          fi
