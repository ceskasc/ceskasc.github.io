name: Upscale relationship photos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upscale-us-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upscale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick webp

      - name: Rebuild relationship photos for full-screen rendering
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="0aaa261a92297ff73c56a0f5584fa61f06a00d9d"
          files=(
            us/assets/film.webp
            us/assets/konya.webp
            us/assets/heart.webp
            us/assets/night.webp
            us/assets/coffee.webp
          )

          for file in "${files[@]}"; do
            source_file="${file%.webp}.source.webp"
            git show "${SOURCE_COMMIT}:${file}" > "$source_file"
            echo "Source: $(identify -format '%f %wx%h %b' "$source_file")"
            convert "$source_file" \
              -filter Lanczos \
              -resize '1800x1800<' \
              -unsharp 0x0.65+0.65+0.006 \
              -strip \
              -quality 90 \
              "$file"
            rm "$source_file"
            echo "Final:  $(identify -format '%f %wx%h %b' "$file")"
          done

      - name: Commit final high-density assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add us/assets/film.webp us/assets/konya.webp us/assets/heart.webp us/assets/night.webp us/assets/coffee.webp
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'fix(us): rebuild photos for high-density displays'
          git pull --rebase origin main
          git push origin HEAD:main
